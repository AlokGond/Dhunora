name: Verify existing Dhunora release
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build Dhunora 1.0 APK run containing the unsigned artifact
        required: true
        default: '35485596678'
  push:
    branches: [codex/simpmusic-parity]
    paths:
      - scripts/smoke-android.py
      - .github/workflows/verify-release.yml
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: Dhunora-v1.0.0-unsigned
          path: smoke-apk
          # Pin acceptance tests to the actual delivered APK, without rebuilding its source.
          run-id: ${{ inputs.build_run_id || '35485596678' }}
          github-token: ${{ github.token }}
      - name: Sign emulator-only test copy
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -keyalg RSA -validity 2 -dname 'CN=Dhunora Smoke Test'
          apk=$(find smoke-apk -name '*x86_64*.apk' | head -1)
          test -n "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --out smoke.apk "$apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify launch and all main navigation controls
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            adb install -r smoke.apk
            python3 scripts/smoke-android.py
      - name: Upload navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-navigation-evidence
          path: smoke-evidence
