name: Build Dhunora 1.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/simpmusic-parity]
concurrency:
  group: dhunora-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare pinned Dhunora sources
        run: python3 scripts/prepare-upstream.py
      - name: Build optimized release APK
        working-directory: upstream/SimpMusic
        run: ./gradlew :androidApp:assembleRelease --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:+UseParallelGC'
      - name: Upload release APKs for signing
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-v1.0.0-unsigned
          path: upstream/SimpMusic/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-v1.0.0-mapping
          path: upstream/SimpMusic/androidApp/build/outputs/mapping/release/mapping.txt
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: Dhunora-v1.0.0-unsigned
          path: smoke-apk
      - name: Sign emulator-only test copy
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -storepass android -keypass android -alias smoke -keyalg RSA -validity 2 -dname 'CN=Dhunora Smoke Test'
          apk=$(find smoke-apk -name '*x86_64*.apk' | head -1)
          test -n "$apk"
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/smoke.jks" --ks-pass pass:android --out smoke.apk "$apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch release code on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: false
          script: |
            adb install -r smoke.apk
            python3 scripts/smoke-android.py
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-smoke-evidence
          path: smoke-evidence
