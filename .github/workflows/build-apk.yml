name: Build Dhunora 1.0 APK
on:
  workflow_dispatch:
  push:
    branches: [main, codex/simpmusic-parity]
concurrency:
  group: dhunora-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Prepare pinned Dhunora sources
        run: python3 scripts/prepare-upstream.py
      - name: Build optimized release APK
        working-directory: upstream/SimpMusic
        run: ./gradlew :androidApp:assembleRelease --no-configuration-cache --max-workers=2 -Dorg.gradle.jvmargs='-Xmx4g -XX:+UseParallelGC'
      - name: Upload release APKs for signing
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-v1.0.0-unsigned
          path: upstream/SimpMusic/androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-v1.0.0-mapping
          path: upstream/SimpMusic/androidApp/build/outputs/mapping/release/mapping.txt
