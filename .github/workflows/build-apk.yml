name: Build Dhunora APK

on:
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Skip build; only attach an existing build artifact APK to a release"
        type: boolean
        default: false
      run_id:
        description: "Build run id whose artifact holds the APK (publish_only)"
        default: "35946049590"
      tag:
        description: "Release tag to attach the APK to (publish_only)"
        default: "v0.8.0-simpmusic"
  push:
    branches: [ main, simpmusic-port ]

jobs:
  build:
    if: ${{ !inputs.publish_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Create release key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/dhunora-release.jks" \
            -storepass dhunora123 \
            -keypass dhunora123 \
            -alias dhunora \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Alok, OU=Dhunora, O=Alok, L=India, C=IN"
          echo "DHUNORA_KEYSTORE=$RUNNER_TEMP/dhunora-release.jks" >> "$GITHUB_ENV"
          echo "DHUNORA_STORE_PASSWORD=dhunora123" >> "$GITHUB_ENV"
          echo "DHUNORA_KEY_ALIAS=dhunora" >> "$GITHUB_ENV"
          echo "DHUNORA_KEY_PASSWORD=dhunora123" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Dhunora-v0.8.0-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dhunora-v0.8.0-release
          path: Dhunora-v0.8.0-release.apk
          if-no-files-found: error

  publish:
    if: ${{ inputs.publish_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: Dhunora-v0.8.0-release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk/
          gh release upload "${{ inputs.tag }}" apk/Dhunora-v0.8.0-release.apk --clobber --repo AlokGond/Dhunora
