name: Publish APK to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id whose artifact holds the APK"
        required: true
        default: "35946049590"
      tag:
        description: "Release tag to attach the APK to"
        required: true
        default: "v0.8.0-simpmusic"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from build run
        uses: actions/download-artifact@v4
        with:
          name: Dhunora-v0.8.0-release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk/
          gh release upload "${{ inputs.tag }}" apk/Dhunora-v0.8.0-release.apk --clobber --repo AlokGond/Dhunora
